name = "routeflow-api"
main = "src/index.ts"
compatibility_date = "2024-03-20"
account_id = "5b5194deaa35116098d3f45dee890e17"

[[d1_databases]]
binding = "DB"
database_name = "routeflow-db"
database_id = "placeholder-id" # To be filled after database creation

[vars]
JWT_ACCESS_EXPIRY = "900" # 15 minutes
JWT_REFRESH_EXPIRY = "2592000" # 30 days
ENVIRONMENT = "development"
ENABLE_TEST_FAILURE_INJECTION = "true"
SMS_MODE = "simulated"

[env.staging]
name = "routeflow-api-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "routeflow-db-staging"
database_id = "0fd38279-d473-44a8-84a2-76da1a1b7b56"

[env.staging.vars]
JWT_ACCESS_EXPIRY = "900"
JWT_REFRESH_EXPIRY = "2592000"
ENVIRONMENT = "staging"
ENABLE_TEST_FAILURE_INJECTION = "true"
SMS_MODE = "simulated"

