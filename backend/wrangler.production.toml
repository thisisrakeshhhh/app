# wrangler.production.toml
# Production Cloudflare Worker configuration for RouteFlow
#
# Deploy command:
#   npx wrangler deploy --config wrangler.production.toml
#
# Production Database Migrations:
#   npx wrangler d1 migrations apply routeflow-db-production --config wrangler.production.toml --remote
#
# Required Cloudflare Production Secrets (Set via CLI, NEVER commit in repository):
#   npx wrangler secret put JWT_SECRET --config wrangler.production.toml
#   npx wrangler secret put SMS_GATEWAY_URL --config wrangler.production.toml
#   npx wrangler secret put SMS_GATEWAY_TOKEN --config wrangler.production.toml

name = "routeflow-api-production"
main = "src/index.ts"
compatibility_date = "2024-03-20"
account_id = "5b5194deaa35116098d3f45dee890e17"

[[d1_databases]]
binding = "DB"
database_name = "routeflow-db-production"
database_id = "placeholder-production-d1-id" # Provision via: npx wrangler d1 create routeflow-db-production

[vars]
JWT_ACCESS_EXPIRY = "900"          # 15 minutes
JWT_REFRESH_EXPIRY = "2592000"     # 30 days
ENVIRONMENT = "production"
ENABLE_TEST_FAILURE_INJECTION = "false"
SMS_MODE = "live"
